services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boardgame
      POSTGRES_PASSWORD: boardgame
      POSTGRES_DB: boardgame
    ports:
      - "5434:5432"
    volumes:
      - boardgame-postgres:/var/lib/postgresql/data
      - ./scripts/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgame -d boardgame"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  boardgame-postgres:
