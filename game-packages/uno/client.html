<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO · 休闲版</title>
<style>
:root{color-scheme:dark;--table:#183e45;--ink:#f5f0df;--muted:#b6cbc9;--red:#b72c43;--yellow:#f0c343;--green:#247854;--blue:#2856a6}
*{box-sizing:border-box}body{margin:0;background:var(--table);color:var(--ink);font:16px/1.5 'Microsoft YaHei','Segoe UI',sans-serif}main{max-width:960px;margin:auto;padding:28px 24px 36px}h1{font:italic 800 32px/1 Georgia,serif;margin:0 0 6px;letter-spacing:-1px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.subtitle{font-size:12px;color:var(--muted);margin:0}button,input,summary{cursor:pointer}button{font:inherit}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid white;outline-offset:4px}button:disabled{cursor:default}#players{display:flex;gap:12px;flex-wrap:wrap;padding:22px 0;border-bottom:1px solid #ffffff24}.player{flex:1;min-width:95px;padding:8px 10px;border-left:3px solid transparent;font-size:13px;color:var(--muted)}.player.current{border-color:var(--yellow);color:var(--ink);background:#ffffff0a}.player strong{display:block;font-size:22px;font-family:Georgia,serif}#arena{display:flex;justify-content:center;align-items:center;gap:26px;min-height:235px;padding:28px 0}.pile{height:132px;width:92px;display:grid;place-content:center;border:2px dashed #ffffff55;border-radius:12px;text-align:center;color:var(--muted);font-size:12px}.pile strong{color:var(--ink);font:32px Georgia,serif}.card{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:86px;min-width:86px;height:128px;border:4px solid #f3edda;border-radius:12px;color:white;font-weight:800;background:var(--blue);box-shadow:0 4px 0 #0004}.card::before{content:'';position:absolute;inset:18px 6px;border:2px solid #ffffff65;border-radius:50%;transform:rotate(25deg)}.card .value{position:relative;font:800 32px/1 Georgia,serif}.card small{position:relative;font-size:12px;margin-top:10px}.red{background:var(--red)}.yellow{background:var(--yellow);color:#342b1a}.green{background:var(--green)}.blue{background:var(--blue)}.wild{background:#27333e}.wild .value{color:#f0c343}.card:disabled{opacity:.45;box-shadow:none}.card:not(:disabled):hover{transform:translateY(-5px)}#top.card{width:100px;height:148px}#color{font-size:14px;margin-top:10px;text-align:center}#status{margin:0;font-weight:700}#notice{min-height:26px;color:var(--muted);font-size:13px;margin:4px 0 18px}#hand{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 16px;scrollbar-width:thin}#hand-title{font-size:13px;color:var(--muted);margin:0}#controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:14px 0 24px}.primary{background:var(--ink);color:var(--table);border:0;border-radius:8px;padding:11px 24px;font-weight:700}.primary:disabled{opacity:.45}label{font-size:14px;display:flex;gap:8px;align-items:center}input{width:18px;height:18px;accent-color:var(--yellow)}details{border-top:1px solid #ffffff24;padding:16px 0;color:var(--muted);font-size:13px}details p{max-width:650px}summary{width:fit-content}dialog{background:#203d43;color:var(--ink);border:1px solid #ffffff50;border-radius:16px;padding:24px;max-width:calc(100vw - 32px)}dialog::backdrop{background:#061b23b8}dialog h2{margin:0 0 20px;font-size:20px}#choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}#choices button{border:2px solid #ffffffaa;border-radius:8px;padding:14px 28px;color:white;font-weight:700}#choices .yellow{color:#342b1a}.cancel{display:block;background:none;border:0;color:var(--muted);margin:18px auto 0;padding:6px 12px}#waiting{color:var(--muted)}[hidden]{display:none!important}@media(max-width:500px){main{padding:20px 16px}h1{font-size:28px}.player{min-width:calc(50% - 12px);padding:4px 8px}#players{padding:16px 0;gap:8px}#arena{min-height:210px;gap:18px;padding:22px 0}.card{min-width:74px;width:74px;height:112px}#controls{gap:12px}#hand{gap:8px}}@media(prefers-reduced-motion:no-preference){.card{transition:transform .12s}}
</style>
</head>
<body>
<main>
<header><div><h1>UNO</h1><p class="subtitle">休闲版 · 先出完手牌</p></div><span id="direction" aria-label="出牌方向"></span></header>
<p id="waiting">等待桌面同步…</p>
<div id="board" hidden>
<section id="players" aria-label="玩家与牌数"></section>
<section id="arena" aria-label="桌面"><div class="pile"><span>摸牌堆</span><strong id="deck-count"></strong></div><div><div id="top" class="card"></div><div id="color"></div></div></section>
<p id="status" role="status" aria-live="polite"></p><p id="notice"></p>
<p id="hand-title">你的手牌 · 点击可用牌出牌</p>
<section id="hand" aria-label="你的手牌"></section>
<div id="controls"><button id="draw" class="primary" type="button">摸一张</button><label id="uno-label" hidden><input id="uno" type="checkbox">出牌时喊 UNO</label></div>
<details><summary>本局规则</summary><p>同色或同符号即可出牌。跳过令下家停一回合；反转改变方向，两人时等同跳过；+2 / +4 让下家摸牌并跳过，不能叠加。</p><p>万能牌先选色；手中没有当前颜色才能出 +4，本版无质疑流程。摸牌后只能出新摸到的牌，也可以保留并结束回合。剩两张时勾选 UNO 再出牌，未喊则自动罚摸两张。</p><p>每人 7 张，单局出完获胜，不累计积分。牌堆空后重洗弃牌；无法继续或到 2000 回合时按最少手牌结算。原创牌面，真人试玩包。</p></details>
</div>
</main>
<dialog id="picker" aria-labelledby="picker-title"><h2 id="picker-title">选择下一张牌的颜色</h2><div id="choices"></div><button id="cancel" class="cancel" type="button">取消出牌</button></dialog>
<script>
const names = {red:'红',yellow:'黄',green:'绿',blue:'蓝',wild:'万能'};
const values = {skip:'⊘',reverse:'⇄',draw2:'+2',wild:'★',wild4:'+4'};
const $ = id => document.getElementById(id);
let view = null;
let busy = true;
let pending = false;
let selected = null;

let sentSnapshot = null;
function cardLabel(card) { return `${names[card.color]}色 ${values[card.value] || card.value}`; }
function face(element, card) {
  element.className = `card ${card.color}`;
  const number = document.createElement('span');
  number.className = 'value'; number.textContent = values[card.value] || card.value;
  const name = document.createElement('small'); name.textContent = names[card.color];
  element.replaceChildren(number, name);
  element.setAttribute('aria-label', cardLabel(card));
}
function send(action) {
  if (busy || pending || !view || view.winners.length) return;
  pending = true;

  sentSnapshot = JSON.stringify(view);
  $('picker').close(); selected = null;
  render();
  parent.postMessage({type:'boardgame:action',action}, '*');
}
function play(card) {
  if (busy || pending) return;
  if (card.color === 'wild') { selected = card.id; $('picker').showModal(); }
  else send({type:'play',cardId:card.id,color:null,uno:$('uno').checked});
}
function render() {
  if (!view) return;
  const locked = busy || pending;
  const myTurn = view.currentSeat === view.you && !view.winners.length;
  $('waiting').hidden = true; $('board').hidden = false;
  $('direction').textContent = view.direction === 1 ? '顺时针 ↻' : '逆时针 ↺';
  $('players').replaceChildren(...view.players.map((player, i) => {
    const item = document.createElement('div'); item.className = 'player' + (player.seatId === view.currentSeat && !view.winners.length ? ' current' : '');
    const name = document.createElement('span'); name.textContent = `座位 ${i+1}${player.seatId === view.you ? ' · 你' : ''}`;
    const count = document.createElement('strong'); count.textContent = `${player.count} 张`;
    item.append(name,count); return item;
  }));
  face($('top'),view.top); $('deck-count').textContent = view.deckCount;
  $('color').textContent = `当前颜色：${names[view.color]}`;
  const current = view.players.findIndex(player => player.seatId === view.currentSeat) + 1;
  $('status').textContent = view.winners.length ? `本局结束 · ${view.winners.map(seat => '座位 '+(view.players.findIndex(player => player.seatId === seat)+1)).join('、')}获胜` : locked ? '正在提交…' : myTurn ? view.drawn ? '可出刚摸的牌，或结束回合' : '轮到你了' : `等待座位 ${current}出牌`;
  $('notice').textContent = view.last;
  $('hand-title').textContent = view.you ? `你的手牌 · ${view.hand.length} 张 · 点击可用牌出牌` : '旁观视图';
  $('hand').replaceChildren(...view.hand.map(card => {
    const button = document.createElement('button'); button.type = 'button'; face(button,card);
    button.disabled = locked || !view.actions.some(action => action.type === 'play' && action.cardId === card.id);
    button.addEventListener('click',()=>play(card)); return button;
  }));
  const drawAction = view.actions.find(action => action.type === 'draw' || action.type === 'pass');
  $('draw').textContent = drawAction && drawAction.type === 'pass' ? '保留并结束回合' : '摸一张';
  $('draw').hidden = !!view.winners.length;
  $('draw').disabled = locked || !drawAction;
  $('uno-label').hidden = !myTurn || view.hand.length !== 2;
  $('uno').disabled = locked;
  if (view.hand.length !== 2) $('uno').checked = false;
  for (const button of $('choices').children) button.disabled = locked;
}
$('draw').addEventListener('click',()=>{
  const action = view.actions.find(item => item.type === 'draw' || item.type === 'pass');
  if (action) send(action);
});
for (const color of ['red','yellow','green','blue']) {
  const button = document.createElement('button'); button.type = 'button'; button.className = color; button.textContent = names[color];
  button.addEventListener('click',()=>{
    if (!selected || !view.actions.some(action => action.type === 'play' && action.cardId === selected && action.color === color)) return;
    send({type:'play',cardId:selected,color,uno:$('uno').checked});
  });
  $('choices').append(button);
}
$('cancel').addEventListener('click',()=>{ $('picker').close(); selected=null; });
$('picker').addEventListener('cancel',()=>{selected=null;});
window.addEventListener('message',event=>{
  if (event.source !== parent || !event.data || event.data.type !== 'boardgame:view') return;
  const incoming = event.data.view;
  const changed = JSON.stringify(incoming) !== sentSnapshot;
  // Parent echoes busy=true before completion. Unlock on its final busy=false,
  // or on an authoritative changed View; repeated idle frames cannot double-submit.
  if (event.data.busy || changed) pending = false;
  else if (busy && !event.data.busy) pending = false;
  busy = !!event.data.busy;
  view = incoming;
  if (selected && (changed || busy)) { $('picker').close(); selected=null; }
  if (!pending) { sentSnapshot=null; }
  render();
});
parent.postMessage({type:'boardgame:ready'}, '*');
</script>
</body>
</html>
